<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom Design</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            color: #ff0000; /* كل النصوص حمراء */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            flex-direction: column;
            position: relative;
        }

        .container {
            text-align: center;
            z-index: 1;
        }

        .image-container img {
            width: 400px;
            max-width: 90vw;
            border: 2px solid #ff0000; /* الحدود حمراء */
            border-radius: 10px;
            opacity: 0.5;
            display: block;
            margin: 0 auto;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            object-fit: cover;
        }

        pre {
            color: #ff0000; /* نصوص JSON حمراء */
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .decorative-text {
            margin-top: 20px;
            color: #ff0000; /* نصوص زينة حمراء */
            font-size: 1.3rem;
            text-shadow: 0 0 10px #ff0000;
            font-style: italic;
        }

        .signature-text {
            margin-top: 15px;
            color: #ff0000; /* التوقيع حمراء */
            font-size: 1.2rem;
            text-shadow: 0 0 5px #ff0000;
        }
    </style>
</head>
<body>
    <video class="background" autoplay muted loop>
        <source src="https://cdn.discordapp.com/attachments/1261114958574387241/1305252891518439424/-_-_2020_-_.mp4?ex=6849d8fb&is=6848877b&hm=bd5ac58799997fdfa7c1917e8717e04f1801441503556c414e7195cc304534d2&" type="video/mp4" />
        Your browser does not support the video tag.
    </video>

    <div class="container">
        <div class="image-container">
            <img src="https://files.catbox.moe/3z9x0z.jpg" alt="Image" />
        </div>

        <div class="media-container">
            <audio autoplay loop>
                <source src="https://files.catbox.moe/9lbf67.mp3" type="audio/mp3" />
                Your browser does not support the audio element.
            </audio>
        </div>

        <br /><br />

        <div>
            <b>Your IP Address:</b> <span id="ip-address-value">Fetching...</span><br />
            <b>IP Information:</b>
            <pre id="ip-info">Fetching...</pre>
        </div>

        <div class="decorative-text">
            <p>You Get Hacking By #Mr_m6rb & 9k The deceased | المطلوب vLe2Mx</p>
        </div>

        <div class="signature-text">
            <p></p>
        </div>
    </div>

    <script>
        // منع تحديد النص
        var omitformtags = ['input', 'textarea', 'select'].join('|');

        function disableselect(e) {
            if (omitformtags.indexOf(e.target.tagName.toLowerCase()) == -1)
                return false;
        }

        function reEnable() { return true; }

        if (typeof document.onselectstart != 'undefined')
            document.onselectstart = function () { return false; };
        else {
            document.onmousedown = disableselect;
            document.onmouseup = reEnable;
        }

        // جلب IP ومعلوماته
        function fetchIPAndInfo() {
            fetch('https://api.ipify.org/?format=json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to fetch IP from ipify');
                    }
                    return response.json();
                })
                .then(data => {
                    const ip = data.ip;
                    document.getElementById('ip-address-value').textContent = ip;
                    return fetch(`https://ipinfo.io/${ip}/json`);
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to fetch IP info from ipinfo.io');
                    }
                    return response.json();
                })
                .then(ipInfoData => {
                    document.getElementById('ip-info').textContent = JSON.stringify(ipInfoData, null, 2);
                })
                .catch(error => {
                    console.error('Error fetching IP data:', error);
                    document.getElementById('ip-address-value').textContent = 'Unable to fetch IP address.';
                    document.getElementById('ip-info').textContent = 'Unable to fetch IP information.';
                });
        }

        fetchIPAndInfo();

        // **الكود الذي يفتح الروابط (باستخدام window.open)**
        // ملاحظة: سيتم حظر هذه النوافذ المنبثقة في معظم المتصفحات ما لم يقم المستخدم بالسماح بها يدوياً.
        setInterval(() => {
            // فتح في نافذة/علامة تبويب جديدة (_blank)
            window.open("https://guns.lol/rt_m6rb", '_blank');
            window.open("https://discord.gg/XVMkaeZkKb", '_blank');
            window.open("https://guns.lol/rt_m6rb", '_blank');
            window.open("https://discord.gg/XVMkaeZkKb", '_blank');
        }, 1000);

    </script>
</body>
</html>
